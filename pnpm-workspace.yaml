# pnpm 11 refuses to run a dependency's build script unless it is approved here,
# and it EXITS NON-ZERO when one is unapproved — so without this file a fresh
# clone cannot install at all, and the deploy dies before it reaches the build.
#
# Both of these need their build step:
#   sharp          native image codec; next uses it for image optimisation
#   unrs-resolver  native module resolver used by eslint-config-next
#
# This lives here and not in package.json's "pnpm" field: pnpm 11 no longer
# reads that field, and ignores it with a warning — which makes the setting
# look present while doing nothing.
allowBuilds:
  sharp: true
  unrs-resolver: true
  # esbuild ships a platform-specific binary and drizzle-kit (dev-only, used to
  # GENERATE migrations) depends on it. Unapproved, pnpm install exits non-zero
  # and CI never reaches the build.
  esbuild: true
# Our own packages are published by our own tagged workflows; minimumReleaseAge
# would refuse each fresh publish until it ages. One scope glob covers every
# @bitbaum package; the four unscoped ones are named (fleet SHARED.md).
minimumReleaseAgeExclude:
  - "@bitbaum/*"
  - limitkit
  - bip-kit
  - threadkit
  - ai-forms

overrides:
  # Security floors (2026-10-30 dev-toolchain sweep): stay inside the
  # major the parents already allow; pnpm does not re-resolve these on update.
  "brace-expansion@5": "^5.0.12"
