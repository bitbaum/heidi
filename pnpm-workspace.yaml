# pnpm 11 refuses to run a dependency's build script unless it is approved here,
# and it EXITS NON-ZERO when one is unapproved — so without this file a fresh
# clone cannot install at all, and the deploy dies before it reaches the build.
#
# Both of these need their build step:
#   sharp          native image codec; next uses it for image optimisation
#   unrs-resolver  native module resolver used by eslint-config-next
#
# This lives here and not in package.json's "pnpm" field: pnpm 11 no longer
# reads that field, and ignores it with a warning — which makes the setting
# look present while doing nothing.
allowBuilds:
  sharp: true
  unrs-resolver: true
  # limitkit is a git dependency, so pnpm runs its `prepare` to build dist/.
  # Without this the install "succeeds" and the package is simply absent.
  limitkit@https://codeload.github.com/bitbaum/limitkit/tar.gz/75adef1e993f90c6079a36a6cd96567cae5924c7: true
  # esbuild ships a platform-specific binary and drizzle-kit (dev-only, used to
  # GENERATE migrations) depends on it. Unapproved, pnpm install exits non-zero
  # and CI never reaches the build.
  esbuild: true
# Our OWN packages are exempt from the release-age quarantine BY NAME, never by
# version. The quarantine guards against a hijacked third-party release; it
# has nothing to defend against in a package we published an hour ago. A
# version-pinned exemption must be hand-edited per release — this line had
# grown to "1.8.0 || 1.10.0 || 1.11.0 || 1.16.0" — and an un-edited release is
# REFUSED at install, which turns every upgrade back into a manual job. Third
# parties stay quarantined; that is the actual threat.
minimumReleaseAgeExclude:
  - '@bitbaum/*'
  - bip-kit
