name: CI

# WHY THIS FILE EXISTS, AND WHY IT IS NOT OPTIONAL
#
# fleetcrown's ci-gate.sh treats "CI green" and "no CI at all" identically —
# both exit 0 and let the deploy proceed. That is a sane default for a repo
# that has not set CI up yet, and it means a site WITHOUT this file deploys
# every push completely unverified while looking exactly like one that passed.
#
# Substrata shipped to production that way. So the scaffold emits this file with
# every new site: the gate has something real to wait for from the first commit.
#
# Runs the same bundle as `pnpm run verify` locally — one definition of verified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A newer push supersedes an older run. ci-gate.sh understands cancelled-and-
# superseded as a clean skip rather than a failure.
concurrency:
  group: ci-${{ github.ref }}
  # Supersede freely on a branch nobody gates on — that is what the setting is
  # for, and a PR pushed three times in a minute should not run CI three times.
  #
  # NEVER on main. Deploy waits for "CI green on this commit" and reads the
  # LATEST CI run for the SHA. The auto-merge sweep re-arms ci.yml on a cadence,
  # so a merge to main reliably produced a green run followed by a cancelled
  # one, and the deploy then refused a commit whose CI had actually passed.
  # That blocked two deploys before anyone read the run list closely enough to
  # notice the green run sitting directly underneath the cancelled one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, because the store tests are about things only a database
    # has an opinion about: an upsert that would violate a primary key, a
    # cascade that has to actually cascade, jsonb that must come back an object
    # rather than a string. Mocking it would assert that the mock agrees with
    # itself. 17 matches the box.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heidi
          POSTGRES_PASSWORD: heidi
          POSTGRES_DB: heidi_test
        ports:
          - 5432:5432
        # Without this the job races the container and the first query fails
        # with ECONNREFUSED on a cold runner.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://heidi:heidi@localhost:5432/heidi_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # --frozen-lockfile: the lockfile is the contract, and a resolution that
      # drifts from it is how a dependency silently changes.
      - run: pnpm install --frozen-lockfile

      # Next keeps its compiler output in .next/cache, and this job BUILDS. With
      # nothing restoring it, every run of every scaffolded site recompiles from
      # scratch — and the deploy then compiles a second time.
      #
      # This file is the third copy of the golden CI floor. The other two live in
      # fleet/templates/ci/, and they gained this step on 2026-09-07 when a fleet
      # sweep found 14 of 32 repos building cold. This one is the copy the
      # scaffold ACTUALLY uses, so it was the one that mattered and the one that
      # was missed — every site created between then and now started cold by
      # construction. Held fleet-wide by fleet's cicd-hygiene-audit.sh, but that
      # ratchet can only flag a repo after it exists; a template fixes it before.
      #
      # Keyed on the lockfile so a dependency change invalidates it. The bare
      # restore-key is last on purpose: a stale cache still beats no cache, and
      # Next validates its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # The same migrations the deploy applies, so the tests run against the
      # schema that is about to ship rather than one written out by hand here.
      - name: Apply migrations
        run: |
          for f in drizzle/[0-9]*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # `verify` verbatim — type-check, lint AND test. This job used to run the
      # first two as separate steps and never ran the third, so the entire unit
      # suite passed only on the machine of whoever remembered to run it. That
      # is the one failure mode a CI floor exists to prevent, and it is exactly
      # why the house rule is that CI calls the repo's own verify script rather
      # than a hand-maintained copy of what it is thought to contain.
      - name: Verify
        run: pnpm run verify

      # The build is the real test for a content site: a broken import or a bad
      # config surfaces here and nowhere earlier.
      - name: Build
        run: pnpm run build
