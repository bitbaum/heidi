name: Deploy

# Push to main → deploy to bitbaum. All logic lives in one place:
# bitbaum/loki/.github/workflows/selfhost-deploy.yml
#
# THIS IS THE ONLY FILE IN THIS REPOSITORY THAT KNOWS ABOUT OUR INFRASTRUCTURE.
# Delete it and this becomes an ordinary Next app the owner can host anywhere —
# which is what makes handover a transfer rather than a migration.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy:
    uses: bitbaum/loki/.github/workflows/selfhost-deploy.yml@main
    with:
      app: heidi
    secrets:
      HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

  # A green deploy is not a working site. This requests every page a visitor
  # can reach, twice — once with a session cookie and once without — because a
  # middleware rewrite once took the locale root down for every signed-in
  # visitor while the test suite, the build and a browser check were all green.
  # See scripts/smoke.sh for what the cookie does and does not prove.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
