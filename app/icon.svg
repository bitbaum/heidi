<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Heidi">
  <!--
    An isogloss: the line a dialect atlas draws where one form stops and
    another starts. It is the subject of the product rendered as a mark —
    map paper, green-black ink, and the survey red the boundary is drawn in.
    Colours are the literal token values from globals.css; an SVG cannot read
    CSS custom properties from another document, so they are repeated here and
    nowhere else.
  -->
  <rect width="32" height="32" rx="6" fill="#edeee8"/>
  <path d="M5 21c4-1.5 5.5-6 9-6.5S20 17 27 12" fill="none" stroke="#b0362b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="11" r="1.8" fill="#191c18"/>
  <circle cx="22" cy="22" r="1.8" fill="#191c18"/>
</svg>
