<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Heidi">
  <!--
    A cow patch, and the isogloss crossing it — the line a dialect atlas draws
    where one form stops and another begins.

    Colours are the literal token values from globals.css; an SVG cannot read
    CSS custom properties from another document, so they are repeated here and
    nowhere else. White ground, one black patch, one red line.
  -->
  <rect width="32" height="32" fill="#ffffff"/>
  <path d="M2 7c5-3 9 1 13-1s9-1 11 3c2 4-1 7-4 8s-3 5-8 6-8-2-10-5-4-7-2-11z" fill="#0d0d0d"/>
  <path d="M4 22c5-2 7-7 12-8s8 2 13-1" fill="none" stroke="#d8232a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
